[project]
name = "ml-ops-skeleton"
version = "0.3.0"
description = "MLOps platform for the AI gateway: kind + ArgoCD + Jenkins bring-up, drills, CI log triage"
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
extend-exclude = ["web", ".drills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tools"]
