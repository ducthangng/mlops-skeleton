# Providers and models the gateway can call. Edit this file to add or remove models;
# the UI reads it through GET /api/catalog. Restart the gateway after editing.
#
# levels:     reasoning/effort levels shown in the UI "Level" dropdown (empty = hidden)
# sampling:   whether temperature / top_p are accepted (hidden in the UI when false)
# A provider whose API key env var is unset is shown as "not configured" and can't be selected.

providers:
  anthropic:
    type: anthropic
    label: Anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    type: openai
    label: OpenAI
    api_key_env: OPENAI_API_KEY
  gemini:
    type: gemini
    label: Google Gemini
    api_key_env: GEMINI_API_KEY
  ollama:
    type: openai            # any OpenAI-compatible server: Ollama, vLLM, LM Studio, OpenRouter...
    label: Ollama (local)
    base_url: http://localhost:11434/v1
    api_key: ollama         # Ollama ignores the key, but the client needs one
    legacy_max_tokens: true
  mock:
    type: mock
    label: Mock (offline)

models:
  # --- Anthropic: thinking is always adaptive; effort is the only depth control.
  # Sampling params (temperature/top_p) are rejected by the current API version.
  - id: claude-opus-5-5
    provider: anthropic
    label: Claude Opus 5.5
    description: Default. Strong reasoning and coding.
    levels: [low, medium, high, xhigh, max]
    default_level: medium
    sampling: false
    max_output_tokens: 128000
    default_max_tokens: 16000
    context_window: 1000000
    refusal_fallback: default
  - id: claude-sonnet-5-5
    provider: anthropic
    label: Claude Sonnet 5.5
    description: Fast everyday work.
    levels: [low, medium, high, xhigh, max]
    default_level: high
    sampling: false
    max_output_tokens: 128000
    default_max_tokens: 16000
    context_window: 1000000
    refusal_fallback: default
  - id: claude-haiku-5-5
    provider: anthropic
    label: Claude Haiku 5.5
    description: Cheapest and fastest.
    levels: [low, medium, high, xhigh, max]
    default_level: low
    sampling: false
    max_output_tokens: 128000
    default_max_tokens: 8192
    context_window: 1000000
  - id: claude-fable-5-2
    provider: anthropic
    label: Claude Fable 5.2
    description: Most capable. Highest price.
    levels: [low, medium, high, xhigh, max]
    default_level: high
    sampling: false
    max_output_tokens: 128000
    default_max_tokens: 32000
    context_window: 1000000
    refusal_fallback: default

  # --- OpenAI (check that these ids are still served on your account)
  - id: gpt-5
    provider: openai
    label: GPT-5
    levels: [minimal, low, medium, high]
    default_level: medium
    sampling: false
    max_output_tokens: 128000
    default_max_tokens: 16000
  - id: gpt-5-mini
    provider: openai
    label: GPT-5 mini
    levels: [minimal, low, medium, high]
    default_level: low
    sampling: false
    max_output_tokens: 128000
    default_max_tokens: 8192

  # --- Google Gemini 2.5: "level" maps to a thinking token budget
  - id: gemini-2.5-pro
    provider: gemini
    label: Gemini 2.5 Pro
    levels: [low, medium, high]
    default_level: medium
    level_style: budget
    max_output_tokens: 65536
    default_max_tokens: 8192
  - id: gemini-2.5-flash
    provider: gemini
    label: Gemini 2.5 Flash
    levels: [low, medium, high]
    default_level: low
    level_style: budget
    max_output_tokens: 65536
    default_max_tokens: 8192

  # --- Local
  - id: llama3.2
    provider: ollama
    label: Llama 3.2 (Ollama)
    max_output_tokens: 8192
    default_max_tokens: 2048

  # --- Offline mock: echoes the prompt. Use it to test the UI, cache and router without keys.
  - id: echo
    provider: mock
    label: Echo (mock)
    description: Streams your prompt back. No network.
    levels: [low, high]
    default_level: low
    max_output_tokens: 4096
    default_max_tokens: 1024
