# cosine similarity score threshold
# if the calculated score below this, then the model do not proceed, but fall back to default
threshold: 0.40
default:
  target: { model: small-chat, temperature: 0.7, max_tokens: 512 }
routes:
  # if the model decided, then it returns the name + the target {} in the resp.
  - name: code
    target: { model: coder, temperature: 0.2, max_tokens: 1024 }
    # utterances are the examples that model used to reference. 
    utterances:
      - "write a python function to parse json"
      - "why does my go program deadlock"
      - "fix this typescript type error"
      - "explain this stack trace"
      - "TypeError: Cannot read property 'map' of undefined"
      - "NullPointerException at line 42"
      - "SyntaxError: unexpected token"
      - "panic: runtime error: index out of range"
      - "Segmentation fault (core dumped)"
      - "CORS error on POST request localhost:3000"
      - "git push rejected non-fast-forward"
      - "docker container exits immediately with code 137"
      - "regex to extract phone numbers"
      - "convert json string to struct in Go"
      - "Rust lifetime error borrow checker"
      - "SQL query to select duplicate rows"
      - "center div flexbox"
      - "fix memory leak in C pointer"
      - "python list comprehension syntax"
      - "Fatal error: Allowed memory size exhausted"

  - name: math
    target: { model: reasoner, temperature: 0.0, max_tokens: 2048 }
    utterances:
      - "solve this integral"
      - "prove that sqrt 2 is irrational"
      - "what is the derivative of x^2 sin x"
      - "probability that two dice sum to 7"
      - "find the inverse of a 3x3 matrix"
      - "calculate the limit as x approaches infinity of (1 + 1/x)^x"
      - "solve the differential equation dy/dx + y = e^x"
      - "find the eigenvalues and eigenvectors of this matrix"
      - "how many ways can you arrange 5 books on a shelf"
      - "calculate the standard deviation of this dataset: [4, 8, 6, 5, 3]"
      - "prove by induction that the sum of first n integers is n(n+1)/2"
      - "find the area enclosed between y = x^2 and y = 2x"
      - "solve for x in 2^(2x) - 5(2^x) + 4 = 0"
      - "what is the Bayesian probability given these prior conditional probabilities"
      - "calculate the cross product of vectors A = (1, 2, 3) and B = (4, 5, 6)"
      - "find the local extrema for f(x) = x^3 - 3x^2 + 2"
      - "what is the remainder when 7^100 is divided by 5"
      - "compute the Taylor series expansion of cos(x) around x = 0"
      - "solve the system of linear equations using Gaussian elimination"
      - "determine if the infinite series sum 1/n^2 converges or diverges"
  - name: chitchat
    target: { model: small-chat, temperature: 0.9, max_tokens: 256 }
    utterances:
      - "hi how are you"
      - "tell me a joke"
      - "what's your favorite movie"
      - "good morning, hope you're having a great day"
      - "do you prefer tea or coffee"
      - "what kind of music do you like to listen to"
      - "what's your opinion on sci-fi movies"
      - "I'm feeling a bit tired today, how's your day going"
      - "who is your favorite fictional character"
      - "are you an early bird or a night owl"
      - "tell me something interesting about yourself"
      - "what should I eat for dinner tonight"
      - "happy weekend! any fun plans?"
      - "give me a random fun fact to cheer me up"
      - "what's your favorite book of all time"
      - "if you could travel anywhere, where would you go"
      - "say something encouraging to start my morning"
      - "what's a good hobby to pick up on weekends"
      - "are you real or just an AI bot"
      - "bye, talk to you later!"


# How does this file work?
# Begin: First: embed all the utterances into vector (this is 384-d)
# Begin: Second: Average each route's vectors into a centroid (a central reference point where the model can work with)

# Inference: First: Embed the prompt
# Second: Calculate cosine similarity between each route's centroid with the embeded prompt.
# Third: Choose highest val -> compare to the threshold.
# Fourth: Return the result.

# TODO: threshold = 0.4 is temporary. Has to be tuned base on the data.
# quality based-on utterance
